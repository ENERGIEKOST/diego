<!DOCTYPE html>
<html lang="ru"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>404 — Страница не найдена | Шиномонтаж у Диего</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0f1115">

    <!-- Превью в мессенджерах: если битой ссылкой поделились, она всё равно выглядит брендированно -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Шиномонтаж у Диего">
    <meta property="og:title" content="Такой страницы нет — но шиномонтаж работает | Шиномонтаж у Диего">
    <meta property="og:description" content="Батайск, ул. Киевская, 24. Ежедневно 10:00–20:00. +7 (988) 899-22-35">
    <meta property="og:image" content="https://udiego.ru/img/icons/og-cover.jpg">
    <meta property="og:url" content="https://udiego.ru/">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Пути абсолютные от корня: 404 может отдаваться по ЛЮБОМУ несуществующему URL (/foo/bar и т.п.).
         Для локального просмотра (file://) в начале <body> есть скрипт-фикс путей. -->
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="/fonts/OpenSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/OpenSans-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/OpenSans-ExtraBold.woff2" as="font" type="font/woff2" crossorigin>

    <style>
        /* ===== ШРИФТЫ (локальный Open Sans, абсолютные пути от корня) ===== */
        @font-face{font-family:'Open Sans';src:url('/fonts/OpenSans-Light.woff2') format('woff2');font-weight:300;font-style:normal;font-display:optional}
        @font-face{font-family:'Open Sans';src:url('/fonts/OpenSans-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:optional}
        @font-face{font-family:'Open Sans';src:url('/fonts/OpenSans-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:optional}
        @font-face{font-family:'Open Sans';src:url('/fonts/OpenSans-SemiBold.woff2') format('woff2');font-weight:600;font-style:normal;font-display:optional}
        @font-face{font-family:'Open Sans';src:url('/fonts/OpenSans-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:optional}
        @font-face{font-family:'Open Sans';src:url('/fonts/OpenSans-ExtraBold.woff2') format('woff2');font-weight:800 900;font-style:normal;font-display:optional}

        :root {
            --accent: #f59e0b;
            --accent-dark: #d97706;
            --accent-soft: rgba(245, 158, 11, 0.12);
            --bg: #0f1115;
            --bg-2: #14171d;
            --card: #1a1e26;
            --line: rgba(255, 255, 255, 0.08);
            --text: #e8e9ec;
            --muted: #9aa0ab;
            --font: 'Open Sans', 'Segoe UI', Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        a { text-decoration: none; color: inherit; transition: 0.3s ease; }

        /* ================= ШАПКА ================= */
        .header {
            padding: 14px 0;
            border-bottom: 1px solid var(--line);
            background: rgba(15, 17, 21, 0.85);
            flex-shrink: 0;
            z-index: 10;
        }
        .container {
            width: 100%;
            max-width: 1140px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .header-inner {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo {
            font-weight: 800;
            font-size: 17px;
            letter-spacing: 0.4px;
            white-space: nowrap;
        }
        .logo span { color: var(--accent); }

        /* ================= ОСНОВНОЙ БЛОК ================= */
        .error-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 30px 20px;
            text-align: center;
        }
        .error-main::before {
            content: '';
            position: absolute;
            top: 42%;
            left: 50%;
            width: 60vw;
            height: 60vw;
            max-width: 500px;
            max-height: 500px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.12) 0%, rgba(245, 158, 11, 0) 70%);
            pointer-events: none;
        }

        .error-container {
            position: relative;
            z-index: 1;
            max-width: 560px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ================= КОЛЕСО ================= */
        .wheel-wrap {
            width: 160px;
            height: 160px;
            margin-bottom: 26px;
        }
        .wheel-spin {
            width: 100%;
            height: 100%;
            display: block;
            animation: wheelRoll 16s linear infinite;
            filter: drop-shadow(0 12px 30px rgba(245, 158, 11, 0.25));
        }
        @keyframes wheelRoll { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .wheel-spin { animation: none; } }

        /* ================= ТЕКСТ ================= */
        .error-title {
            font-size: clamp(40px, 9vw, 72px);
            font-weight: 800;
            letter-spacing: -2px;
            line-height: 1;
        }
        .error-title span { color: var(--accent); }
        .error-sub {
            font-size: clamp(18px, 2.5vw, 22px);
            font-weight: 800;
            margin: 10px 0 12px;
        }
        .error-text {
            font-size: 15px;
            color: var(--muted);
            margin-bottom: 24px;
            line-height: 1.6;
            max-width: 440px;
        }

        /* ================= КНОПКИ ================= */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            transition: 0.3s ease;
            background: linear-gradient(135deg, #fbbf24, var(--accent-dark));
            color: #1a1206;
            box-shadow: 0 8px 24px rgba(245, 158, 11, 0.25);
        }
        .btn:hover { filter: brightness(1.08); transform: translateY(-2px); }
        .btn-phone {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            font-weight: 700;
            color: var(--muted);
        }
        .btn-phone:hover { color: var(--accent); }
        .btn-phone b { color: var(--text); }
        .btn-phone:hover b { color: var(--accent); }

        /* ================= ПОДВАЛ ================= */
        .footer {
            border-top: 1px solid var(--line);
            padding: 18px 0;
            color: var(--muted);
            font-size: 13.5px;
            text-align: center;
            flex-shrink: 0;
        }

        /* ================= АДАПТИВ ================= */
        @media (max-width: 560px) {
        .wheel-wrap { width: 120px; height: 120px; margin-bottom: 20px; }
        .btn { width: 100%; }
    }
    </style>
</head>
<body>
    <!-- Фикс для локального просмотра (file://): абсолютные пути -> относительные -->
    <script>
    if (location.protocol === 'file:') {
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('link[href^="/img/"]').forEach(function (el) {
                el.href = el.getAttribute('href').slice(1);
            });
            var s = document.createElement('style');
            s.textContent = [
                "@font-face{font-family:'Open Sans';src:url('fonts/OpenSans-Light.woff2') format('woff2');font-weight:300;font-style:normal;font-display:swap}",
                "@font-face{font-family:'Open Sans';src:url('fonts/OpenSans-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}",
                "@font-face{font-family:'Open Sans';src:url('fonts/OpenSans-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}",
                "@font-face{font-family:'Open Sans';src:url('fonts/OpenSans-SemiBold.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap}",
                "@font-face{font-family:'Open Sans';src:url('fonts/OpenSans-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}",
                "@font-face{font-family:'Open Sans';src:url('fonts/OpenSans-ExtraBold.woff2') format('woff2');font-weight:800 900;font-style:normal;font-display:swap}"
            ].join('');
            document.head.appendChild(s);
        });
    }
    </script>

    <header class="header">
        <div class="container header-inner">
            <a href="/" class="logo" aria-label="Шиномонтаж у Диего — на главную">ШИНОМОНТАЖ&nbsp;<span>У&nbsp;ДИЕГО</span></a>
        </div>
    </header>

    <main class="error-main">
        <div class="error-container">
            <!-- Колесо -->
            <div class="wheel-wrap" aria-hidden="true">
                <svg class="wheel-spin" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                    <!-- шина -->
                    <circle cx="32" cy="32" r="30" fill="#151920" stroke="#2b313d" stroke-width="2"/>
                    <!-- протектор: 8 одинаковых насечек по кругу -->
                    <g stroke="#2b313d" stroke-width="2.5" stroke-linecap="round">
                        <path d="M58 32h3M50.4 50.4l2.1 2.1M32 58v3M13.6 50.4l-2.1 2.1M6 32H3M13.6 13.6l-2.1-2.1M32 6V3M50.4 13.6l2.1-2.1"/>
                    </g>
                    <!-- диск -->
                    <circle cx="32" cy="32" r="18" fill="#0f1115" stroke="#f59e0b" stroke-width="3.5"/>
                    <!-- 5 спиц строго через центр, шаг 72° -->
                    <g stroke="#f59e0b" stroke-width="3" stroke-linecap="round">
                        <path d="M32 25V15"/>
                        <path d="M38.7 29.8 48.2 26.8"/>
                        <path d="M36.1 37.7 42 45.8"/>
                        <path d="M27.9 37.7 22 45.8"/>
                        <path d="M25.3 29.8 15.8 26.8"/>
                    </g>
                    <!-- ступица -->
                    <circle cx="32" cy="32" r="4.5" fill="#f59e0b"/>
                </svg>
            </div>

            <h1 class="error-title">4<span>0</span>4</h1>
            <p class="error-sub">Страница не найдена</p>
            <p class="error-text">
                Похоже, такой страницы не существует или она была удалена.<br>
                А шиномонтаж работает как обычно — ждём вас на главной!
            </p>

            <a href="/" class="btn">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
                На главную
            </a>
            <a href="tel:+79888992235" class="btn-phone">Или позвоните: <b>+7 (988) 899-22-35</b></a>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 Шиномонтаж у Диего · <a href="tel:+79888992235">+7 (988) 899-22-35</a> · ежедневно 10:00–20:00</p>
        </div>
    </footer>
</body>
</html>
